name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q ExpiryTracker.zip
      - run: |
          sed -i 's/^package io.expiry.tracker$/package io.expiry.tracker\nimport androidx.compose.foundation.isSystemInDarkTheme/' ExpiryTracker/app/src/main/java/io/expiry/tracker/MainActivity.kt
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > ExpiryTracker/gradle.properties
      - run: cd ExpiryTracker && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ExpiryTracker/app/build/outputs/apk/debug/app-debug.apk
